services:
  access-control:
    build:
      context: ./rpi
    container_name: access-control
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      BOT_TOKEN: "${BOT_TOKEN}"
      ALLOWED_CHAT_ID: "${ALLOWED_CHAT_ID}"
      ESP_URL: "${ESP_URL}"
      ACCESS_KEY: "${ACCESS_KEY}"
